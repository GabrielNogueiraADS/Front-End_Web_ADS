
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Musical</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0e6ff;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px #cccccc;
        }

        h1 {
            text-align: center;
            color: #6a0dad;
        }

        p {
            text-align: center;
            color: #555555;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .opcao {
            margin-top: 10px;
        }

        .opcao label {
            display: inline;
            font-weight: normal;
            margin-left: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #6a0dad;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4b087a;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1> Seu Estilo Musical</h1>
        <p>Conte um pouco sobre suas preferências musicais!</p>

        <form action="#" method="post">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Digite seu nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email"
                   placeholder="Digite seu e-mail" required>

            <label for="estilo">Qual é seu estilo musical favorito?</label>
            <select id="estilo" name="estilo" required>
                <option value="">Selecione uma opção</option>
                <option value="pop">Pop</option>
                <option value="rock">Rock</option>
                <option value="sertanejo">Sertanejo</option>
                <option value="funk">Funk</option>
                <option value="rap">Rap / Hip-hop</option>
                <option value="gospel">Gospel</option>
                <option value="mpb">MPB</option>
                <option value="eletronica">Eletrônica</option>
                <option value="pagode">Pagode</option>
                <option value="outro">Outro</option>
            </select>

            <label>Quais outros estilos você gosta?</label>

            <div class="opcao">
                <input type="checkbox" id="pop" name="outros[]" value="Pop">
                <label for="pop">Pop</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="rock" name="outros[]" value="Rock">
                <label for="rock">Rock</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="sertanejo" name="outros[]" value="Sertanejo">
                <label for="sertanejo">Sertanejo</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="funk" name="outros[]" value="Funk">
                <label for="funk">Funk</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="rap" name="outros[]" value="Rap">
                <label for="rap">Rap / Hip-hop</label>
            </div>

            <div class="opcao">
                <input type="checkbox" id="mpb" name="outros[]" value="MPB">
                <label for="mpb">MPB</label>
            </div>

            <label for="frequencia">
                Com que frequência você escuta música?
            </label>

            <select id="frequencia" name="frequencia" required>
                <option value="">Selecione uma opção</option>
                <option value="raramente">Raramente</option>
                <option value="algumas vezes">Algumas vezes por semana</option>
                <option value="diariamente">Todos os dias</option>
                <option value="sempre">Quase o tempo todo</option>
            </select>

            <label for="plataforma">
                Onde você costuma ouvir música?
            </label>

            <select id="plataforma" name="plataforma">
                <option value="">Selecione uma opção</option>
                <option value="spotify">Spotify</option>
                <option value="youtube">YouTube</option>
                <option value="deezer">Deezer</option>
                <option value="radio">Rádio</option>
                <option value="outras">Outras plataformas</option>
            </select>

            <label for="comentarios">
                Qual é seu cantor ou banda favorito?
            </label>

            <textarea id="comentarios" name="comentarios"
                      rows="4"
                      placeholder="Escreva sua resposta aqui..."></textarea>

            <button type="submit">Enviar respostas</button>

        </form>
    </div>

</body>
</html>
